[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-round-table-mcp"
version = "0.1.1"
description = "Sequential multi-provider AI delegation MCP server"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2", "jsonschema>=4.17.3,<4.18"]

[tool.setuptools]
py-modules = ["server"]
